<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DYNAST — Orion Concierge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --obsidian: #050506;
      --onyx: #0c0c0f;
      --gold: #d4af37;
      --champagne: #f3e5ab;
      --bronze: #8a6d1c;
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--obsidian);
      color: #f6f2e9;
      overflow: hidden;
    }

    .font-brand {
      font-family: 'Cinzel Decorative', serif;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Calm Luxury Obsidian & Warm Gold Aura */
    .ambient-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(212, 175, 55, 0.10) 0%, rgba(212, 175, 55, 0.03) 34%, transparent 65%),
        radial-gradient(circle at 50% 100%, rgba(138, 109, 28, 0.09) 0%, transparent 48%),
        linear-gradient(180deg, #040405 0%, #070709 50%, #040405 100%);
      pointer-events: none;
      z-index: 0;
    }

    .hairline-gold {
      border: 1px solid rgba(212, 175, 55, 0.22);
    }

    .obsidian-pill {
      background: rgba(14, 14, 17, 0.72);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(212, 175, 55, 0.18);
      transition: border-color 0.25s ease, background-color 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
    }

    .obsidian-pill:hover {
      border-color: rgba(243, 229, 171, 0.42);
      background: rgba(20, 19, 22, 0.85);
    }

    .obsidian-panel {
      background: rgba(10, 10, 12, 0.90);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(212, 175, 55, 0.26);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(243, 229, 171, 0.12);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #f7ecc1 0%, #d4af37 52%, #a88222 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gold-btn {
      background: linear-gradient(135deg, #e5c667 0%, #d4af37 50%, #b38b24 100%);
      color: #080809;
      box-shadow: 0 8px 28px rgba(212, 175, 55, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transition: filter 0.2s ease, transform 0.15s ease, box-shadow 0.25s ease;
    }

    .gold-btn:hover {
      filter: brightness(1.08);
      box-shadow: 0 10px 32px rgba(212, 175, 55, 0.34);
    }

    .gold-btn:active {
      transform: scale(0.97);
    }

    /* Calm custom scrollbar */
    .calm-scroll::-webkit-scrollbar {
      width: 3px;
    }
    .calm-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .calm-scroll::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.28);
      border-radius: 999px;
    }

    @keyframes breatheCalm {
      0%, 100% { opacity: 0.78; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.03); }
    }
    .breathe-calm {
      animation: breatheCalm 4.8s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex flex-col items-center justify-between p-4 select-none relative">

  <div class="ambient-backdrop"></div>

  <!-- HARDWARE AUDIO PLAYER -->
  <audio id="orionPlayer" playsinline preload="auto" class="hidden"></audio>

  <!-- PRIVATE ACCESS LOCK SCREEN -->
  <div id="lockScreen" class="relative z-20 h-full flex flex-col items-center justify-center w-full max-w-xs">
    <div class="relative w-24 h-24 flex items-center justify-center mb-6 breathe-calm">
      <div class="absolute inset-0 rounded-full bg-[#d4af37]/15 blur-2xl"></div>
      <div class="w-20 h-20 rounded-full hairline-gold flex items-center justify-center bg-[#0a0a0c]/80">
        <div class="w-12 h-12 rounded-full border border-[#f3e5ab]/25 flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-[#e6c96c] shadow-[0_0_18px_rgba(212,175,55,0.85)]"></div>
        </div>
      </div>
    </div>

    <h1 class="text-2xl tracking-[0.42em] font-brand gold-gradient-text mb-1.5">DYNAST</h1>
    <p class="text-[10px] font-mono-tech tracking-[0.3em] text-[#b9ab86] mb-8 uppercase">Private Orion Suite</p>

    <div class="w-full obsidian-panel rounded-3xl p-6">
      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PASSCODE"
        onkeydown="if(event.key === 'Enter') unlockDynast()"
        class="bg-black/60 border border-[#d4af37]/20 rounded-2xl px-4 py-3.5 text-center font-mono-tech text-sm tracking-[0.4em] text-[#f3e5ab] placeholder-[#6f6650] mb-3.5 w-full outline-none focus:border-[#d4af37]/70 transition"
      />
      <p id="pinError" class="text-[11px] text-amber-400/90 text-center mb-3 hidden">Passcode not recognized</p>
      <button
        id="unlockBtn"
        onclick="unlockDynast()"
        class="gold-btn font-semibold text-xs py-3.5 rounded-2xl tracking-[0.26em] w-full uppercase"
      >
        Enter Suite
      </button>
    </div>
  </div>

  <!-- MAIN CALM LUXURY INTERFACE -->
  <div id="mainScreen" class="hidden relative z-10 h-full w-full max-w-lg flex flex-col items-center justify-between py-1">

    <!-- TOP MINIMAL HUD -->
    <div class="w-full flex flex-col items-center z-30">
      <div class="w-full flex items-center justify-between gap-2">
        <div class="obsidian-pill px-3.5 py-1.5 rounded-full flex items-center gap-2">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-[#d4af37] shadow-[0_0_10px_rgba(212,175,55,0.8)]"></span>
          <span id="statusText" class="text-[10px] font-mono-tech tracking-[0.2em] text-[#e7dcc0]">ORION READY</span>
        </div>

        <h1 class="text-lg tracking-[0.4em] font-brand gold-gradient-text">DYNAST</h1>

        <div class="flex items-center gap-1.5">
          <button
            onclick="testOrionVoiceButton()"
            id="muteBtn"
            class="obsidian-pill px-3 py-1.5 rounded-full text-[10px] font-mono-tech text-[#f3e5ab]"
            title="Test Orion Voice"
          >
            VOICE ON
          </button>
          <button
            onclick="toggleHub()"
            class="obsidian-pill px-2.5 py-1.5 rounded-full text-[10px] font-mono-tech text-[#c9bc9a]"
          >
            HUB
          </button>
        </div>
      </div>

      <!-- Collapsible Ecosystem Hub -->
      <div id="hubPanel" class="hidden w-full obsidian-panel rounded-2xl p-3 mt-2.5 flex flex-wrap items-center justify-center gap-2">
        <a href="https://dynast.co.in" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-xl bg-white/[0.03] border border-[#d4af37]/20 text-xs text-[#ece2c8] hover:border-[#d4af37]/60 transition">Main Store</a>
        <a href="https://dynast.co.in/bespoke" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-xl bg-white/[0.03] border border-[#d4af37]/20 text-xs text-[#ece2c8] hover:border-[#d4af37]/60 transition">Bespoke Studio</a>
        <a href="https://dynast.co.in/admin" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-xl bg-white/[0.03] border border-[#d4af37]/20 text-xs text-[#ece2c8] hover:border-[#d4af37]/60 transition">Admin Panel</a>
        <a href="https://dynast.co.in/bespoke-admin" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-xl bg-white/[0.03] border border-[#d4af37]/20 text-xs text-[#ece2c8] hover:border-[#d4af37]/60 transition">Bespoke Admin</a>
        <button onclick="toggleHistoryDrawer()" class="px-3 py-1.5 rounded-xl bg-[#d4af37]/10 border border-[#d4af37]/30 text-xs text-[#f3e5ab] hover:bg-[#d4af37]/20 transition">Journal</button>
        <button onclick="toggleMuteState()" class="px-3 py-1.5 rounded-xl bg-white/[0.04] border border-white/15 text-xs text-[#d6cbb0] hover:border-[#d4af37]/50 transition">Mute / Unmute</button>
        <button onclick="clearHistory()" class="px-3 py-1.5 rounded-xl bg-white/[0.03] border border-amber-500/25 text-xs text-amber-300/80 hover:border-amber-400/60 transition">Reset Memory</button>
      </div>
    </div>

    <!-- INTERACTIVE HOROLOGY CHRONOMETER ORB & LIVE RESPONSE -->
    <div class="flex-1 flex flex-col items-center justify-center w-full relative my-1">
      <div
        id="orbWrapper"
        class="relative flex items-center justify-center cursor-pointer touch-none"
        onclick="handleOrbTap(event)"
        onpointermove="handleOrbPointerMove(event)"
        onpointerleave="handleOrbPointerLeave()"
      >
        <canvas id="orbCanvas" class="w-[300px] h-[300px] sm:w-[340px] sm:h-[340px]"></canvas>
        <div class="absolute pointer-events-none flex flex-col items-center justify-center text-center px-6">
          <span id="orbCenterLabel" class="text-[10px] font-mono-tech tracking-[0.34em] text-[#f5e7be] uppercase">Tap to Speak</span>
          <span id="latencyLabel" class="text-[9px] font-mono-tech text-[#c9a94b] mt-1.5 tracking-[0.22em] uppercase">Orion Core</span>
        </div>
      </div>

      <p id="transcriptText" class="text-xs text-[#9c9072] italic mt-1 mb-2 text-center max-w-sm px-4 hidden"></p>

      <div class="w-full max-w-md px-4 text-center">
        <p id="replyText" class="calm-scroll text-[15px] sm:text-base font-light text-[#f4ede0]/95 leading-relaxed tracking-wide max-h-36 overflow-y-auto px-2">
          Orion is online and synced with DYNAST. Tap the core or type below to begin.
        </p>
      </div>

      <!-- Deployment Confirmation Sheet -->
      <div id="confirmBox" class="hidden mt-3 w-full obsidian-panel rounded-2xl p-4 text-center">
        <p class="text-[10px] font-mono-tech uppercase tracking-[0.26em] text-[#e5c667] mb-1">Confirm Live Deployment</p>
        <p id="confirmDetails" class="text-xs text-[#cfc4aa] mb-3"></p>
        <div class="flex gap-3 justify-center">
          <button onclick="executeConfirmedAction()" class="gold-btn font-semibold px-5 py-2 rounded-xl text-xs tracking-wider uppercase">
            Deploy Now
          </button>
          <button onclick="cancelStagedAction()" class="obsidian-pill text-[#cfc4aa] px-4 py-2 rounded-xl text-xs">
            Cancel
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM INTERACTIVE COMMAND DOCK -->
    <div class="w-full flex flex-col gap-2.5 z-30 pb-1">
      <div class="flex items-center justify-center flex-wrap gap-2 text-[11px]">
        <button
          id="liveModeBtn"
          onclick="toggleContinuousLive()"
          class="obsidian-pill px-3.5 py-1.5 rounded-full flex items-center gap-1.5 text-[#d6cbb0]"
        >
          <span class="w-1.5 h-1.5 rounded-full bg-[#776a4a]"></span>
          <span>Live Hands-Free: OFF</span>
        </button>
        <button
          onclick="sendCommand('Give me a calm briefing on today\'s top world, business, and tech news')"
          class="obsidian-pill px-3 py-1.5 rounded-full text-[#e7dcc0]"
        >
          World Briefing
        </button>
        <button
          onclick="sendCommand('Analyze my DYNAST admin panel data including orders, revenue, and stock status')"
          class="obsidian-pill px-3 py-1.5 rounded-full text-[#e7dcc0]"
        >
          Admin Analytics
        </button>
      </div>

      <form onsubmit="handleTextSubmit(event)" class="w-full obsidian-pill rounded-2xl p-1.5 flex items-center gap-2 shadow-2xl">
        <button
          type="button"
          onclick="handleOrbTap(event)"
          class="w-10 h-10 rounded-xl bg-[#d4af37]/12 border border-[#d4af37]/30 flex items-center justify-center text-[#f3e5ab] hover:bg-[#d4af37]/22 transition shrink-0"
          title="Speak"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
          </svg>
        </button>
        <input
          id="textInput"
          type="text"
          placeholder="Speak or message DYNAST..."
          class="flex-1 bg-transparent px-2 py-2 text-sm text-[#f7f2e7] placeholder-[#7a7059] outline-none"
        />
        <button
          type="submit"
          class="gold-btn font-semibold px-4 py-2.5 rounded-xl text-xs tracking-[0.18em] shrink-0 uppercase"
        >
          Send
        </button>
      </form>
    </div>
  </div>

  <!-- INTERACTIVE CONVERSATION JOURNAL DRAWER -->
  <div id="historyDrawer" class="hidden fixed inset-0 z-40 bg-black/75 backdrop-blur-md flex items-end sm:items-center justify-center p-4">
    <div class="obsidian-panel w-full max-w-md max-h-[75vh] rounded-3xl p-5 flex flex-col">
      <div class="flex items-center justify-between pb-3 mb-3 border-b border-[#d4af37]/20">
        <span class="text-xs font-mono-tech tracking-[0.28em] text-[#f3e5ab] uppercase">Session Journal</span>
        <button onclick="toggleHistoryDrawer()" class="text-xs font-mono-tech text-[#a99b7a] hover:text-[#f3e5ab]">CLOSE</button>
      </div>
      <div id="historyList" class="calm-scroll flex-1 overflow-y-auto space-y-3 pr-1 text-xs"></div>
    </div>
  </div>

  <script>
    let sessionPin = sessionStorage.getItem("DYNAST_SESSION_PIN") || "";
    let chatHistory = [];
    let stagedAction = null;
    let isMuted = false;
    let continuousLiveMode = false;
    let currentState = "ONLINE"; // ONLINE | LISTENING | THINKING | SPEAKING

    let audioCtx = null;
    let gainNode = null;
    let analyser = null;
    let freqData = null;
    let mediaElementConnected = false;
    let audioUnlocked = false;

    let activeFetchController = null;
    let activeRecognition = null;
    let textAnimInterval = null;
    let orbStarted = false;

    // Interactive orb pointer & ripple state
    let pointerOffset = { x: 0, y: 0, targetX: 0, targetY: 0 };
    let ripples = [];

    // Load & normalize saved history
    try {
      const raw = JSON.parse(localStorage.getItem("DYNAST_CHAT_MEMORY") || "[]");
      if (Array.isArray(raw)) {
        chatHistory = raw
          .filter((item) => {
            const t = String(item?.text || "").toLowerCase();
            return t && !t.includes("audio channel") && !t.includes("quota") && !t.includes("error:");
          })
          .map((item) => ({
            role: item.role === "user" || item.role === "Hanzalah" ? "user" : "assistant",
            text: String(item.text).replace(/,\s*Hanzalah([.!?])/gi, "$1")
          }));
      }
    } catch (e) {
      chatHistory = [];
    }
    saveHistory();

    function saveHistory() {
      localStorage.setItem("DYNAST_CHAT_MEMORY", JSON.stringify(chatHistory.slice(-14)));
      renderHistoryDrawer();
    }

    function renderHistoryDrawer() {
      const list = document.getElementById("historyList");
      if (!list) return;
      if (!chatHistory.length) {
        list.innerHTML = `<p class="text-[#7c725b] text-center py-8">No conversations recorded yet.</p>`;
        return;
      }
      list.innerHTML = chatHistory
        .map((m) => {
          const isUser = m.role === "user";
          return `
            <div class="${isUser ? "ml-8 bg-[#d4af37]/10 border-[#d4af37]/25" : "mr-8 bg-white/[0.03] border-white/10"} border rounded-2xl px-3.5 py-2.5">
              <div class="text-[9px] font-mono-tech tracking-[0.2em] ${isUser ? "text-[#e5c667]" : "text-[#9c9072]"} mb-1 uppercase">${isUser ? "Founder" : "DYNAST"}</div>
              <div class="text-[#efe7d5] leading-relaxed">${escapeHtml(m.text)}</div>
            </div>
          `;
        })
        .join("");
      list.scrollTop = list.scrollHeight;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function toggleHistoryDrawer() {
      document.getElementById("hubPanel").classList.add("hidden");
      document.getElementById("historyDrawer").classList.toggle("hidden");
      renderHistoryDrawer();
    }

    function initAudioGraph() {
      const player = document.getElementById("orionPlayer");
      const AudioCtx = window.AudioContext || window.webkitAudioContext;

      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();
        gainNode = audioCtx.createGain();
        // Unity gain so backend soft-knee normalization stays crisp and distortion-free
        gainNode.gain.value = 1.0;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.84;
        freqData = new Uint8Array(analyser.frequencyBinCount);

        if (player && !mediaElementConnected) {
          try {
            const mediaSource = audioCtx.createMediaElementSource(player);
            mediaSource.connect(gainNode);
            gainNode.connect(analyser);
            analyser.connect(audioCtx.destination);
            mediaElementConnected = true;
          } catch (e) {
            mediaElementConnected = false;
          }
        }
      }

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      audioUnlocked = true;
    }

    async function unlockDynast() {
      const pinInput = document.getElementById("pinInput");
      const pinError = document.getElementById("pinError");
      const unlockBtn = document.getElementById("unlockBtn");
      const pinVal = pinInput.value.trim();

      if (!pinVal) {
        pinError.classList.remove("hidden");
        return;
      }

      unlockBtn.textContent = "VERIFYING...";
      unlockBtn.disabled = true;
      pinError.classList.add("hidden");

      try {
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-dynast-pin": pinVal },
          body: JSON.stringify({ verifyPin: true, pin: pinVal })
        });

        if (!res.ok) {
          pinError.classList.remove("hidden");
          unlockBtn.textContent = "ENTER SUITE";
          unlockBtn.disabled = false;
          return;
        }

        sessionPin = pinVal;
        sessionStorage.setItem("DYNAST_SESSION_PIN", pinVal);
        initAudioGraph();
        showMainSuite();
      } catch (e) {
        pinError.textContent = "Connection error. Please try again.";
        pinError.classList.remove("hidden");
        unlockBtn.textContent = "ENTER SUITE";
        unlockBtn.disabled = false;
      }
    }

    function showMainSuite() {
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
      if (!orbStarted) {
        orbStarted = true;
        startOrbAnimation();
      }
    }

    // Auto-resume unlocked session if already verified in this tab
    if (sessionPin) {
      showMainSuite();
    }

    async function testOrionVoiceButton() {
      isMuted = false;
      updateMuteButtonUI();
      initAudioGraph();
      spawnRipple(1.1);
      setVisualStatus("THINKING");

      try {
        const startTime = performance.now();
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-dynast-pin": sessionPin },
          body: JSON.stringify({
            ttsOnly: true,
            ttsText: "Orion voice is active and calibrated for DYNAST."
          })
        });
        const elapsed = performance.now() - startTime;
        const data = await res.json();
        await playOrionResponse("Orion voice is active and calibrated for DYNAST.", data.audioDataUri, elapsed);
      } catch (e) {
        setVisualStatus("ONLINE");
      }
    }

    function toggleMuteState() {
      isMuted = !isMuted;
      if (isMuted) stopSpeaking();
      updateMuteButtonUI();
    }

    function updateMuteButtonUI() {
      const btn = document.getElementById("muteBtn");
      btn.textContent = isMuted ? "MUTED" : "VOICE ON";
      btn.style.color = isMuted ? "#9e8e6e" : "#f3e5ab";
      btn.style.borderColor = isMuted ? "rgba(255,255,255,0.12)" : "rgba(212,175,55,0.38)";
    }

    function toggleHub() {
      document.getElementById("hubPanel").classList.toggle("hidden");
    }

    function toggleContinuousLive() {
      initAudioGraph();
      continuousLiveMode = !continuousLiveMode;
      const btn = document.getElementById("liveModeBtn");
      if (continuousLiveMode) {
        btn.style.borderColor = "rgba(212, 175, 55, 0.65)";
        btn.style.color = "#f5e7be";
        btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-[#e5c667] animate-pulse"></span><span>Live Hands-Free: ON</span>`;
        startListening();
      } else {
        stopListening();
        btn.style.borderColor = "rgba(212, 175, 55, 0.18)";
        btn.style.color = "#d6cbb0";
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-[#776a4a]"></span><span>Live Hands-Free: OFF</span>`;
      }
    }

    function stopListening() {
      if (activeRecognition) {
        try {
          activeRecognition.onresult = null;
          activeRecognition.onerror = null;
          activeRecognition.onend = null;
          activeRecognition.stop();
          activeRecognition.abort();
        } catch (e) {}
        activeRecognition = null;
      }
    }

    function stopSpeaking() {
      const player = document.getElementById("orionPlayer");
      if (player) {
        try {
          player.onplay = null;
          player.onended = null;
          player.onerror = null;
          player.pause();
        } catch (e) {}
      }
    }

    function clearHistory() {
      chatHistory = [];
      stagedAction = null;
      localStorage.removeItem("DYNAST_CHAT_MEMORY");
      renderHistoryDrawer();
      document.getElementById("confirmBox").classList.add("hidden");
      document.getElementById("hubPanel").classList.add("hidden");
      animateReplyText("Session memory cleared. Ready whenever you are.");
    }

    function setVisualStatus(state, latencyMs = null) {
      currentState = state;
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const centerLabel = document.getElementById("orbCenterLabel");
      const latencyLabel = document.getElementById("latencyLabel");

      if (latencyMs) {
        latencyLabel.textContent = `${(latencyMs / 1000).toFixed(1)}s • ORION`;
      }

      if (state === "LISTENING") {
        statusText.textContent = "LISTENING";
        statusDot.className = "w-2 h-2 rounded-full bg-[#f7ecc1] shadow-[0_0_12px_rgba(247,236,193,0.95)] animate-ping";
        centerLabel.textContent = "Listening";
      } else if (state === "THINKING") {
        statusText.textContent = "ANALYZING";
        statusDot.className = "w-2 h-2 rounded-full bg-[#d4af37] shadow-[0_0_12px_rgba(212,175,55,0.9)] animate-pulse";
        centerLabel.textContent = "Thinking";
      } else if (state === "SPEAKING") {
        statusText.textContent = "ORION SPEAKING";
        statusDot.className = "w-2 h-2 rounded-full bg-[#f3e5ab] shadow-[0_0_14px_rgba(243,229,171,0.95)] animate-pulse";
        centerLabel.textContent = "Tap to Pause";
      } else {
        statusText.textContent = "ORION READY";
        statusDot.className = "w-2 h-2 rounded-full bg-[#d4af37] shadow-[0_0_10px_rgba(212,175,55,0.8)]";
        centerLabel.textContent = "Tap to Speak";
      }
    }

    function animateReplyText(text) {
      if (textAnimInterval) {
        clearInterval(textAnimInterval);
        textAnimInterval = null;
      }
      const el = document.getElementById("replyText");
      const words = String(text).trim().split(/\s+/);
      el.textContent = "";
      let i = 0;
      textAnimInterval = setInterval(() => {
        if (i >= words.length) {
          clearInterval(textAnimInterval);
          textAnimInterval = null;
          return;
        }
        el.textContent += (i === 0 ? "" : " ") + words[i];
        el.scrollTop = el.scrollHeight;
        i++;
      }, 26);
    }

    async function playOrionResponse(replyText, audioDataUri, elapsedMs) {
      stopListening();
      stopSpeaking();

      if (isMuted || !audioDataUri) {
        animateReplyText(replyText);
        setVisualStatus("ONLINE", elapsedMs);
        if (continuousLiveMode) {
          setTimeout(() => startListening(), 450);
        }
        return;
      }

      if (!audioUnlocked) initAudioGraph();
      if (audioCtx && audioCtx.state === "suspended") {
        try { await audioCtx.resume(); } catch (e) {}
      }

      const player = document.getElementById("orionPlayer");
      if (!player) {
        animateReplyText(replyText);
        setVisualStatus("ONLINE", elapsedMs);
        return;
      }

      player.muted = false;
      player.volume = 1.0;
      player.src = audioDataUri;

      player.onplay = () => {
        setVisualStatus("SPEAKING", elapsedMs);
        animateReplyText(replyText);
      };

      player.onended = () => {
        setVisualStatus("ONLINE", elapsedMs);
        if (continuousLiveMode) {
          setTimeout(() => startListening(), 320);
        }
      };

      player.onerror = () => {
        animateReplyText(replyText);
        setVisualStatus("ONLINE", elapsedMs);
        if (continuousLiveMode) {
          setTimeout(() => startListening(), 450);
        }
      };

      try {
        await player.play();
      } catch (e) {
        animateReplyText(replyText);
        setVisualStatus("ONLINE", elapsedMs);
        if (continuousLiveMode) {
          setTimeout(() => startListening(), 450);
        }
      }
    }

    async function executeConfirmedAction() {
      if (!stagedAction) return;
      initAudioGraph();
      spawnRipple(1.2);
      setVisualStatus("THINKING");
      document.getElementById("confirmBox").classList.add("hidden");

      try {
        const startTime = performance.now();
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-dynast-pin": sessionPin },
          body: JSON.stringify({ confirmAction: stagedAction })
        });
        const elapsed = performance.now() - startTime;
        const data = await res.json();
        stagedAction = null;

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          animateReplyText(data.error || "Unable to complete deployment.");
          return;
        }

        chatHistory.push({ role: "assistant", text: data.reply });
        saveHistory();
        await playOrionResponse(data.reply, data.audioDataUri, elapsed);
      } catch (err) {
        setVisualStatus("ONLINE");
        animateReplyText("Network interruption during deployment.");
      }
    }

    function cancelStagedAction() {
      stagedAction = null;
      document.getElementById("confirmBox").classList.add("hidden");
      animateReplyText("Deployment cancelled.");
      setVisualStatus("ONLINE");
    }

    async function sendCommand(commandText) {
      const cleanCmd = String(commandText || "").trim();
      if (!cleanCmd) return;

      initAudioGraph();
      if (activeFetchController) {
        try { activeFetchController.abort(); } catch (e) {}
        activeFetchController = null;
      }
      stopListening();
      stopSpeaking();

      const lower = cleanCmd.toLowerCase();
      if (stagedAction && ["confirm", "confirm update", "deploy", "yes"].includes(lower)) {
        await executeConfirmedAction();
        return;
      }

      const startTime = performance.now();
      spawnRipple(1.0);
      setVisualStatus("THINKING");

      const transcriptEl = document.getElementById("transcriptText");
      transcriptEl.textContent = `“${cleanCmd}”`;
      transcriptEl.classList.remove("hidden");

      activeFetchController = new AbortController();

      try {
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-dynast-pin": sessionPin },
          body: JSON.stringify({
            prompt: cleanCmd,
            chatHistory: chatHistory.slice(-10)
          }),
          signal: activeFetchController.signal
        });

        const elapsed = performance.now() - startTime;
        const data = await res.json();
        activeFetchController = null;

        if (res.status === 401) {
          sessionStorage.removeItem("DYNAST_SESSION_PIN");
          sessionPin = "";
          document.getElementById("mainScreen").classList.add("hidden");
          document.getElementById("lockScreen").classList.remove("hidden");
          return;
        }

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          animateReplyText(data.error || "Unable to complete that request right now.");
          return;
        }

        if (data.pendingAction) {
          stagedAction = data.pendingAction;
          document.getElementById("confirmDetails").textContent =
            `${stagedAction.filePath} — ${stagedAction.summaryOfChanges}`;
          document.getElementById("confirmBox").classList.remove("hidden");
        }

        chatHistory.push({ role: "user", text: cleanCmd });
        chatHistory.push({ role: "assistant", text: data.reply });
        saveHistory();

        await playOrionResponse(data.reply, data.audioDataUri, elapsed);
      } catch (err) {
        if (err.name === "AbortError") return;
        setVisualStatus("ONLINE");
        animateReplyText("Connection paused. Tap the core to try again.");
      }
    }

    function handleTextSubmit(e) {
      e.preventDefault();
      initAudioGraph();
      const input = document.getElementById("textInput");
      const val = input.value;
      input.value = "";
      sendCommand(val);
    }

    function handleOrbTap(e) {
      initAudioGraph();
      spawnRipple(1.25);

      if (currentState === "SPEAKING") {
        stopSpeaking();
        setVisualStatus("ONLINE");
        return;
      }
      if (currentState === "LISTENING") {
        stopListening();
        setVisualStatus("ONLINE");
        return;
      }
      startListening();
    }

    function handleOrbPointerMove(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      const ny = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
      pointerOffset.targetX = Math.max(-1, Math.min(1, nx)) * 14;
      pointerOffset.targetY = Math.max(-1, Math.min(1, ny)) * 14;
    }

    function handleOrbPointerLeave() {
      pointerOffset.targetX = 0;
      pointerOffset.targetY = 0;
    }

    function spawnRipple(strength = 1) {
      ripples.push({ radius: 74, alpha: 0.55 * strength, speed: 1.55 });
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        animateReplyText("Live voice capture requires Chrome or Edge. You can type your command below.");
        return;
      }

      stopSpeaking();
      stopListening();

      const recognition = new SpeechRecognition();
      activeRecognition = recognition;
      recognition.lang = "en-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        spawnRipple(0.9);
        setVisualStatus("LISTENING");
      };

      recognition.onresult = (e) => {
        const text = e.results?.[0]?.[0]?.transcript || "";
        activeRecognition = null;
        if (text.trim()) sendCommand(text);
        else setVisualStatus("ONLINE");
      };

      recognition.onerror = (e) => {
        activeRecognition = null;
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          continuousLiveMode = false;
          setVisualStatus("ONLINE");
          animateReplyText("Microphone access is blocked. Please allow mic permissions in your browser.");
          return;
        }
        setVisualStatus("ONLINE");
        if (continuousLiveMode && (e.error === "no-speech" || e.error === "aborted")) {
          setTimeout(() => {
            if (continuousLiveMode && currentState === "ONLINE") startListening();
          }, 600);
        }
      };

      recognition.onend = () => {
        activeRecognition = null;
        if (currentState === "LISTENING") {
          setVisualStatus("ONLINE");
          if (continuousLiveMode) {
            setTimeout(() => {
              if (continuousLiveMode && currentState === "ONLINE") startListening();
            }, 500);
          }
        }
      };

      try {
        recognition.start();
      } catch (e) {
        setVisualStatus("ONLINE");
      }
    }

    // HIGH-DPI CALM HOROLOGY CHRONOMETER & ASTROLABE ORB
    function startOrbAnimation() {
      const canvas = document.getElementById("orbCanvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const size = Math.max(280, Math.round(rect.width || 320));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return size;
      }

      let viewSize = resizeCanvas();
      window.addEventListener("resize", () => {
        viewSize = resizeCanvas();
      });

      const particles = Array.from({ length: 24 }, (_, idx) => ({
        angle: (idx / 24) * Math.PI * 2,
        orbit: 96 + (idx % 4) * 14,
        speed: (idx % 2 === 0 ? 1 : -1) * (0.002 + (idx % 5) * 0.0008),
        size: 0.9 + (idx % 3) * 0.55
      }));

      let time = 0;
      let smoothEnergy = 0.08;

      function render() {
        const cx = viewSize / 2;
        const cy = viewSize / 2;
        ctx.clearRect(0, 0, viewSize, viewSize);

        // Smooth pointer parallax
        pointerOffset.x += (pointerOffset.targetX - pointerOffset.x) * 0.08;
        pointerOffset.y += (pointerOffset.targetY - pointerOffset.y) * 0.08;

        let targetEnergy = 0.06 + Math.sin(time * 1.4) * 0.025;
        let bars = null;

        if (currentState === "SPEAKING") {
          if (analyser && mediaElementConnected && freqData) {
            analyser.getByteFrequencyData(freqData);
            bars = freqData;
            let sum = 0;
            for (let i = 0; i < 32; i++) sum += freqData[i];
            targetEnergy = Math.min(1, Math.max(0.18, sum / (32 * 220)));
          } else {
            targetEnergy = 0.28 + Math.abs(Math.sin(time * 4.5)) * 0.22;
          }
        } else if (currentState === "LISTENING") {
          targetEnergy = 0.22 + Math.sin(time * 3.4) * 0.09;
        } else if (currentState === "THINKING") {
          targetEnergy = 0.26 + Math.sin(time * 5.2) * 0.08;
        }

        smoothEnergy += (targetEnergy - smoothEnergy) * 0.12;
        const coreR = (viewSize * 0.235) + smoothEnergy * 11;

        // 1. Calm Warm Obsidian-Gold Ambient Halo
        const halo = ctx.createRadialGradient(cx, cy, coreR * 0.35, cx, cy, coreR * 2.05);
        halo.addColorStop(0, `rgba(212, 175, 55, ${0.20 + smoothEnergy * 0.24})`);
        halo.addColorStop(0.55, `rgba(176, 138, 42, ${0.07 + smoothEnergy * 0.10})`);
        halo.addColorStop(1, "rgba(5, 5, 6, 0)");
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(cx, cy, coreR * 2.05, 0, Math.PI * 2);
        ctx.fill();

        // 2. Interactive Tap Ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.radius += rp.speed;
          rp.alpha *= 0.962;
          if (rp.alpha < 0.01) {
            ripples.splice(i, 1);
            continue;
          }
          ctx.beginPath();
          ctx.arc(cx, cy, rp.radius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(243, 229, 171, ${rp.alpha})`;
          ctx.lineWidth = 1.1;
          ctx.stroke();
        }

        // 3. Precision Horology Bezel Ticks (60 subtle chronometer indices)
        const bezelR = coreR + 28;
        const bezelRot = time * (currentState === "THINKING" ? 0.38 : 0.06);
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(bezelRot);
        for (let i = 0; i < 60; i++) {
          const a = (i / 60) * Math.PI * 2;
          const isMajor = i % 5 === 0;
          const len = isMajor ? 7 : 3;
          const r1 = bezelR;
          const r2 = bezelR + len;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
          ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
          ctx.strokeStyle = isMajor
            ? `rgba(243, 229, 171, ${0.42 + smoothEnergy * 0.35})`
            : `rgba(212, 175, 55, ${0.18 + smoothEnergy * 0.18})`;
          ctx.lineWidth = isMajor ? 1.25 : 0.75;
          ctx.stroke();
        }
        ctx.restore();

        // 4. Dual Calm Elliptical Astrolabe Orbits
        for (let o = 0; o < 2; o++) {
          ctx.save();
          ctx.translate(cx + pointerOffset.x * 0.25, cy + pointerOffset.y * 0.25);
          ctx.rotate((o === 0 ? 1 : -1) * time * (currentState === "THINKING" ? 0.65 : 0.18) + o * 1.1);
          ctx.scale(1, 0.76);
          ctx.beginPath();
          ctx.arc(0, 0, coreR + 16 + o * 8, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(212, 175, 55, ${0.22 + smoothEnergy * 0.25})`;
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.restore();
        }

        // 5. Real-Time Radial Golden Voice Spectrum (visible smoothly when speaking/listening)
        if (currentState === "SPEAKING" || currentState === "LISTENING") {
          const spokeCount = 48;
          for (let i = 0; i < spokeCount; i++) {
            const a = (i / spokeCount) * Math.PI * 2 - Math.PI / 2;
            const binVal = bars
              ? bars[i % 32] / 255
              : 0.22 + Math.abs(Math.sin(time * 4 + i * 0.45)) * 0.32;
            const barLen = 4 + binVal * 22;
            const startR = coreR + 6;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * startR, cy + Math.sin(a) * startR);
            ctx.lineTo(cx + Math.cos(a) * (startR + barLen), cy + Math.sin(a) * (startR + barLen));
            ctx.strokeStyle = `rgba(243, 229, 171, ${0.26 + binVal * 0.58})`;
            ctx.lineWidth = 1.4;
            ctx.lineCap = "round";
            ctx.stroke();
          }
        }

        // 6. Calm Orbiting Gold Motes
        for (const p of particles) {
          p.angle += p.speed * (currentState === "THINKING" ? 2.6 : 1 + smoothEnergy * 1.4);
          const px = cx + Math.cos(p.angle) * p.orbit;
          const py = cy + Math.sin(p.angle) * p.orbit;
          ctx.fillStyle = `rgba(243, 229, 171, ${0.18 + smoothEnergy * 0.35})`;
          ctx.beginPath();
          ctx.arc(px, py, p.size, 0, Math.PI * 2);
          ctx.fill();
        }

        // 7. Liquid Obsidian-Gold Core Sphere with Interactive Specular Light
        const hx = cx - coreR * 0.28 + pointerOffset.x;
        const hy = cy - coreR * 0.28 + pointerOffset.y;
        const coreGrad = ctx.createRadialGradient(hx, hy, coreR * 0.08, cx, cy, coreR);
        coreGrad.addColorStop(0, `rgba(248, 236, 194, ${0.30 + smoothEnergy * 0.28})`);
        coreGrad.addColorStop(0.38, `rgba(184, 142, 46, ${0.24 + smoothEnergy * 0.22})`);
        coreGrad.addColorStop(0.82, "rgba(18, 15, 10, 0.94)");
        coreGrad.addColorStop(1, "rgba(5, 5, 6, 0.98)");

        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.fill();

        // Crisp gilded rim around core
        ctx.beginPath();
        ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(243, 229, 171, ${0.38 + smoothEnergy * 0.42})`;
        ctx.lineWidth = 1.3;
        ctx.stroke();

        time += 0.018 + smoothEnergy * 0.022;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
