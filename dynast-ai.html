<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DYNAST — Executive AI Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-black text-white flex flex-col items-center justify-between p-6 select-none">

  <!-- PIN Screen -->
  <div id="lockScreen" class="min-h-screen flex flex-col items-center justify-center w-full max-w-sm">
    <h1 class="text-3xl tracking-[0.35em] font-serif text-amber-400 mb-2">DYNAST</h1>
    <p class="text-xs tracking-widest text-neutral-400 mb-6">FOUNDER COMMAND (HANZALAH)</p>

    <input
      id="pinInput"
      type="password"
      inputmode="numeric"
      placeholder="Founder PIN (060709)"
      class="bg-neutral-900 border border-amber-500/40 rounded px-4 py-3 text-center tracking-widest text-white mb-4 w-full outline-none focus:border-amber-400"
    />

    <p id="pinError" class="text-xs text-red-400 mb-3 hidden">Invalid PIN.</p>

    <button
      onclick="unlockDynast()"
      class="bg-amber-500 text-black font-semibold px-8 py-2.5 rounded tracking-wider hover:bg-amber-400 w-full"
    >
      INITIALIZE
    </button>
  </div>

  <!-- Main Voice Interface -->
  <div id="mainScreen" class="hidden min-h-screen w-full flex flex-col items-center justify-between py-4">
    <div class="text-center w-full max-w-md">
      <h1 class="text-2xl tracking-[0.4em] font-serif text-amber-400">DYNAST</h1>
      <p id="statusText" class="text-xs tracking-widest text-amber-200/60 mt-1">STATUS: ONLINE (HANZALAH)</p>

      <div class="flex flex-wrap items-center justify-center gap-2 mt-3 text-[10px] text-neutral-400">
        <a href="https://dynast.co.in" target="_blank" class="px-2 py-1 rounded bg-neutral-900 border border-neutral-800 hover:border-amber-500/50">Main Site</a>
        <a href="https://dynast.co.in/bespoke" target="_blank" class="px-2 py-1 rounded bg-neutral-900 border border-neutral-800 hover:border-amber-500/50">Bespoke Studio</a>
        <a href="https://dynast.co.in/admin" target="_blank" class="px-2 py-1 rounded bg-neutral-900 border border-neutral-800 hover:border-amber-500/50">Admin</a>
        <a href="https://dynast.co.in/bespoke-admin" target="_blank" class="px-2 py-1 rounded bg-neutral-900 border border-neutral-800 hover:border-amber-500/50">Bespoke Admin</a>
        <button onclick="clearHistory()" class="px-2 py-1 rounded bg-neutral-950 border border-red-900/40 text-red-400">Clear Memory</button>
      </div>
    </div>

    <!-- Glowing Futuristic Orb -->
    <div class="flex flex-col items-center my-4 w-full max-w-lg">
      <button
        id="orbBtn"
        onclick="startListening()"
        class="w-44 h-44 rounded-full flex items-center justify-center border-2 border-amber-500/50 shadow-[0_0_35px_rgba(245,158,11,0.3)] transition-all duration-500 hover:scale-105"
      >
        <div class="w-32 h-32 rounded-full bg-gradient-to-tr from-black via-neutral-900 to-amber-500/20 border border-amber-400/30 flex items-center justify-center">
          <span id="orbLabel" class="text-xs tracking-[0.25em] text-amber-300">TAP TO SPEAK</span>
        </div>
      </button>

      <p id="transcriptText" class="text-sm text-neutral-400 italic mt-5 text-center max-w-md hidden"></p>

      <div class="mt-4 w-full bg-neutral-950 border border-amber-500/20 rounded-xl p-5 text-center">
        <p id="replyText" class="text-amber-100 leading-relaxed text-sm whitespace-pre-line">
          Welcome back, Hanzalah. DYNAST neural link is connected to dynast.co.in, your admin panels, Supabase, and GitHub.
        </p>
      </div>

      <!-- Staged GitHub Update Confirmation Box -->
      <div id="confirmBox" class="hidden mt-4 w-full bg-amber-950/20 border border-amber-500/60 rounded-xl p-4 text-center">
        <p class="text-xs uppercase tracking-widest text-amber-400 font-semibold mb-1">Pending Website Update</p>
        <p id="confirmDetails" class="text-xs text-neutral-300 mb-3"></p>
        <div class="flex gap-3 justify-center">
          <button
            onclick="executeConfirmedAction()"
            class="bg-amber-500 text-black font-semibold px-4 py-2 rounded text-xs tracking-wider hover:bg-amber-400"
          >
            CONFIRM & PUSH TO GITHUB
          </button>
          <button
            onclick="cancelStagedAction()"
            class="bg-neutral-800 text-neutral-300 px-4 py-2 rounded text-xs hover:bg-neutral-700"
          >
            CANCEL
          </button>
        </div>
      </div>
    </div>

    <!-- Text Command Bar -->
    <form onsubmit="handleTextSubmit(event)" class="w-full max-w-md flex gap-2 mb-2">
      <input
        id="textInput"
        type="text"
        placeholder="Ask DYNAST or command a website update..."
        class="flex-1 bg-neutral-900 border border-neutral-800 rounded-lg px-4 py-3 text-sm text-white outline-none focus:border-amber-500"
      />
      <button type="submit" class="bg-amber-500 text-black font-medium px-5 py-3 rounded-lg text-sm">
        Send
      </button>
    </form>
  </div>

  <script>
    const FOUNDER_PIN = "060709";
    let chatHistory = JSON.parse(localStorage.getItem("DYNAST_CHAT_MEMORY") || "[]");
    let stagedAction = null;

    function saveHistory() {
      localStorage.setItem("DYNAST_CHAT_MEMORY", JSON.stringify(chatHistory.slice(-16)));
    }

    function clearHistory() {
      chatHistory = [];
      localStorage.removeItem("DYNAST_CHAT_MEMORY");
      document.getElementById("replyText").textContent = "Session memory cleared, Hanzalah.";
    }

    function unlockDynast() {
      const pinVal = document.getElementById("pinInput").value.trim();
      if (pinVal !== FOUNDER_PIN) {
        document.getElementById("pinError").classList.remove("hidden");
        return;
      }
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
    }

    function setVisualStatus(state) {
      document.getElementById("statusText").textContent = "STATUS: " + state + " (HANZALAH)";
      const orb = document.getElementById("orbBtn");
      const label = document.getElementById("orbLabel");
      orb.className = "w-44 h-44 rounded-full flex items-center justify-center border-2 transition-all duration-500 ";

      if (state === "LISTENING") {
        orb.className += "border-amber-300 shadow-[0_0_75px_rgba(251,191,36,0.9)] scale-110";
        label.textContent = "LISTENING";
      } else if (state === "SPEAKING") {
        orb.className += "border-amber-400 shadow-[0_0_65px_rgba(245,158,11,0.8)] animate-pulse";
        label.textContent = "SPEAKING";
      } else if (state === "THINKING") {
        orb.className += "border-amber-600 shadow-[0_0_45px_rgba(217,119,6,0.5)] animate-pulse";
        label.textContent = "THINKING";
      } else {
        orb.className += "border-amber-500/50 shadow-[0_0_35px_rgba(245,158,11,0.3)] hover:scale-105";
        label.textContent = "TAP TO SPEAK";
      }
    }

    function speakOutLoud(text) {
      if (!("speechSynthesis" in window)) {
        setVisualStatus("ONLINE");
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const preferred =
        voices.find((v) => v.name.includes("Google UK English Male")) ||
        voices.find((v) => v.name.includes("Natural") || v.name.includes("Enhanced")) ||
        voices.find((v) => v.lang.startsWith("en-GB")) ||
        voices.find((v) => v.lang.startsWith("en"));
      if (preferred) utterance.voice = preferred;
      utterance.rate = 0.96;
      utterance.pitch = 0.90;
      utterance.onstart = () => setVisualStatus("SPEAKING");
      utterance.onend = () => setVisualStatus("ONLINE");
      utterance.onerror = () => setVisualStatus("ONLINE");
      window.speechSynthesis.speak(utterance);
    }

    async function executeConfirmedAction() {
      if (!stagedAction) return;
      setVisualStatus("THINKING");
      document.getElementById("confirmBox").classList.add("hidden");

      try {
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ confirmAction: stagedAction })
        });
        const data = await res.json();
        stagedAction = null;

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          document.getElementById("replyText").textContent = "Error: " + (data.error || "Failed to push update.");
          return;
        }

        chatHistory.push({ role: "DYNAST", text: data.reply });
        saveHistory();
        document.getElementById("replyText").textContent = data.reply;
        speakOutLoud(data.reply);
      } catch (err) {
        setVisualStatus("ONLINE");
        document.getElementById("replyText").textContent = "Network Error: " + err.message;
      }
    }

    function cancelStagedAction() {
      stagedAction = null;
      document.getElementById("confirmBox").classList.add("hidden");
      const msg = "Staged website update cancelled, Hanzalah.";
      document.getElementById("replyText").textContent = msg;
      speakOutLoud(msg);
    }

    async function sendCommand(commandText) {
      if (!commandText.trim()) return;

      const lower = commandText.trim().toLowerCase();
      if (stagedAction && (lower === "confirm" || lower === "confirm update" || lower === "yes confirm" || lower === "push it")) {
        await executeConfirmedAction();
        return;
      }

      setVisualStatus("THINKING");
      const transcriptEl = document.getElementById("transcriptText");
      transcriptEl.textContent = "“" + commandText + "”";
      transcriptEl.classList.remove("hidden");

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 12000);

      try {
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: commandText,
            chatHistory: chatHistory
          }),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          setVisualStatus("ONLINE");
          document.getElementById("replyText").textContent =
            "Server Error: /api/dynast returned non-JSON (" + rawText.slice(0, 100) + ").";
          return;
        }

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          document.getElementById("replyText").textContent = data.error;
          return;
        }

        if (data.pendingAction) {
          stagedAction = data.pendingAction;
          document.getElementById("confirmDetails").textContent =
            `File: ${stagedAction.filePath} — ${stagedAction.summaryOfChanges}`;
          document.getElementById("confirmBox").classList.remove("hidden");
        }

        chatHistory.push({ role: "Hanzalah", text: commandText });
        chatHistory.push({ role: "DYNAST", text: data.reply });
        saveHistory();

        document.getElementById("replyText").textContent = data.reply;
        speakOutLoud(data.reply);
      } catch (err) {
        clearTimeout(timeoutId);
        setVisualStatus("ONLINE");
        document.getElementById("replyText").textContent =
          err.name === "AbortError"
            ? "Request timed out after 12 seconds. Tap Send to retry."
            : "Connection Error: " + err.message;
      }
    }

    function handleTextSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("textInput");
      const val = input.value;
      input.value = "";
      sendCommand(val);
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome for voice commands.");
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = "en-IN";
      recognition.onstart = () => setVisualStatus("LISTENING");
      recognition.onresult = (e) => sendCommand(e.results[0][0].transcript);
      recognition.onerror = () => setVisualStatus("ONLINE");
      recognition.start();
    }
  </script>
</body>
</html>
