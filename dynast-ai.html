<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DYNAST — Live AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030305;
      overflow: hidden;
    }
    .font-brand { font-family: 'Cinzel Decorative', serif; }
    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    .ambient-glow {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 38%, rgba(245, 158, 11, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 20% 80%, rgba(56, 189, 248, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 80% 20%, rgba(168, 85, 247, 0.06) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .glass-pill {
      background: rgba(15, 15, 20, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-panel {
      background: rgba(12, 12, 16, 0.76);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .float-anim { animation: floatSlow 5s ease-in-out infinite; }
  </style>
</head>
<body class="h-[100dvh] w-screen text-white flex flex-col items-center justify-between p-4 select-none relative">

  <div class="ambient-glow"></div>

  <!-- PIN AUTHENTICATION SCREEN -->
  <div id="lockScreen" class="relative z-20 h-full flex flex-col items-center justify-center w-full max-w-xs">
    <div class="relative w-24 h-24 flex items-center justify-center mb-6">
      <div class="absolute inset-0 rounded-full bg-amber-500/20 blur-xl animate-pulse"></div>
      <div class="w-16 h-16 rounded-full border border-amber-400/40 flex items-center justify-center glass-pill">
        <div class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_15px_#fbbf24]"></div>
      </div>
    </div>

    <h1 class="text-2xl tracking-[0.4em] font-brand text-amber-300 mb-1">DYNAST</h1>
    <p class="text-[10px] font-mono-tech tracking-[0.28em] text-neutral-400 mb-8">NEURAL VOICE INTERFACE</p>

    <div class="w-full glass-panel rounded-3xl p-6 shadow-2xl">
      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PASSCODE"
        onkeydown="if(event.key === 'Enter') unlockDynast()"
        class="bg-black/60 border border-white/10 rounded-2xl px-4 py-3.5 text-center font-mono-tech text-sm tracking-[0.35em] text-amber-100 mb-4 w-full outline-none focus:border-amber-400/70 transition"
      />
      <p id="pinError" class="text-xs text-rose-400 text-center mb-3 hidden">Invalid Passcode</p>
      <button
        onclick="unlockDynast()"
        class="bg-gradient-to-r from-amber-500 via-amber-300 to-amber-500 text-black font-semibold text-xs py-3.5 rounded-2xl tracking-[0.22em] hover:brightness-110 active:scale-[0.98] transition w-full shadow-[0_0_25px_rgba(245,158,11,0.3)]"
      >
        INITIALIZE LIVE AI
      </button>
    </div>
  </div>

  <!-- MAIN FUTURISTIC AI INTERFACE -->
  <div id="mainScreen" class="hidden relative z-10 h-full w-full max-w-lg flex flex-col items-center justify-between py-1">

    <!-- TOP FLOATING HUD BAR -->
    <div class="w-full flex flex-col items-center z-30">
      <div class="w-full flex items-center justify-between gap-2">
        <div class="glass-pill px-3.5 py-1.5 rounded-full flex items-center gap-2">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]"></span>
          <span id="statusText" class="text-[10px] font-mono-tech tracking-[0.2em] text-neutral-200">LIVE READY</span>
        </div>

        <h1 class="text-lg tracking-[0.38em] font-brand text-amber-300/90">DYNAST</h1>

        <div class="flex items-center gap-1.5">
          <button
            onclick="toggleMute()"
            id="muteBtn"
            class="glass-pill px-3 py-1.5 rounded-full text-[10px] font-mono-tech text-amber-300 hover:border-amber-400/50 transition"
          >
            GAIN: 2.5X
          </button>
          <button
            onclick="toggleHub()"
            class="glass-pill px-2.5 py-1.5 rounded-full text-[10px] font-mono-tech text-neutral-300 hover:border-white/30 transition"
          >
            HUB
          </button>
        </div>
      </div>

      <!-- Collapsible Ecosystem Hub Drawer -->
      <div id="hubPanel" class="hidden w-full glass-panel rounded-2xl p-3 mt-2.5 flex flex-wrap items-center justify-center gap-2">
        <a href="https://dynast.co.in" target="_blank" class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs text-neutral-200 hover:border-amber-400/50">Main Store</a>
        <a href="https://dynast.co.in/bespoke" target="_blank" class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs text-neutral-200 hover:border-amber-400/50">Bespoke Studio</a>
        <a href="https://dynast.co.in/admin" target="_blank" class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs text-neutral-200 hover:border-amber-400/50">Admin</a>
        <a href="https://dynast.co.in/bespoke-admin" target="_blank" class="px-3 py-1.5 rounded-xl bg-white/5 border border-white/10 text-xs text-neutral-200 hover:border-amber-400/50">Bespoke Admin</a>
        <button onclick="clearHistory()" class="px-3 py-1.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300">Clear Memory</button>
      </div>
    </div>

    <!-- CENTER FLUID PLASMA AI CORE & SUBTITLES -->
    <div class="flex-1 flex flex-col items-center justify-center w-full relative my-1">
      <div class="relative flex items-center justify-center cursor-pointer" onclick="handleOrbTap()">
        <canvas id="orbCanvas" width="320" height="320" class="w-[260px] h-[260px] sm:w-[290px] sm:h-[290px]"></canvas>
        <div class="absolute pointer-events-none flex flex-col items-center justify-center">
          <span id="orbCenterLabel" class="text-[10px] font-mono-tech tracking-[0.28em] text-amber-200/80 uppercase">Tap to Speak</span>
          <span id="latencyLabel" class="text-[9px] font-mono-tech text-neutral-400 mt-1 opacity-75">GEMINI LIVE VOICE</span>
        </div>
      </div>

      <p id="transcriptText" class="text-xs text-neutral-400/90 italic mt-1 mb-2 text-center max-w-sm px-3 hidden"></p>

      <div class="w-full max-w-md px-3 text-center float-anim">
        <p id="replyText" class="text-base sm:text-lg font-light text-amber-50/95 leading-relaxed tracking-wide max-h-40 overflow-y-auto px-2">
          I'm online and listening. Tap the core or enable Hands-Free Live to talk naturally.
        </p>
      </div>

      <!-- Staged GitHub Update Confirmation Modal -->
      <div id="confirmBox" class="hidden mt-3 w-full glass-panel rounded-2xl p-4 text-center shadow-2xl">
        <p class="text-[10px] font-mono-tech uppercase tracking-[0.25em] text-amber-300 mb-1">Confirm Website Deployment</p>
        <p id="confirmDetails" class="text-xs text-neutral-300 mb-3"></p>
        <div class="flex gap-3 justify-center">
          <button onclick="executeConfirmedAction()" class="bg-amber-400 text-black font-semibold px-5 py-2 rounded-xl text-xs tracking-wider hover:brightness-110">
            DEPLOY NOW
          </button>
          <button onclick="cancelStagedAction()" class="bg-white/10 text-neutral-300 px-4 py-2 rounded-xl text-xs hover:bg-white/15">
            CANCEL
          </button>
        </div>
      </div>
    </div>

    <!-- BOTTOM FUTURISTIC COMMAND DOCK -->
    <div class="w-full flex flex-col gap-2.5 z-30 pb-1">
      <div class="flex items-center justify-center gap-2 text-[11px]">
        <button
          id="liveModeBtn"
          onclick="toggleContinuousLive()"
          class="glass-pill px-3.5 py-1.5 rounded-full flex items-center gap-1.5 text-neutral-300 hover:border-amber-400/50 transition"
        >
          <span id="liveModeDot" class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span>
          <span>Hands-Free Live: OFF</span>
        </button>
        <button
          onclick="sendCommand('Give me a quick update on today\'s top business and tech news')"
          class="glass-pill px-3 py-1.5 rounded-full text-neutral-300 hover:border-amber-400/50 transition"
        >
          Live Briefing
        </button>
        <button
          onclick="sendCommand('Check my Supabase orders and store status')"
          class="glass-pill px-3 py-1.5 rounded-full text-neutral-300 hover:border-amber-400/50 transition"
        >
          Store Status
        </button>
      </div>

      <form onsubmit="handleTextSubmit(event)" class="w-full glass-pill rounded-2xl p-1.5 flex items-center gap-2 shadow-2xl">
        <button
          type="button"
          onclick="handleOrbTap()"
          class="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-400/30 flex items-center justify-center text-amber-300 hover:bg-amber-500/25 transition shrink-0"
          title="Speak"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z" />
          </svg>
        </button>
        <input
          id="textInput"
          type="text"
          placeholder="Message DYNAST or speak..."
          class="flex-1 bg-transparent px-2 py-2 text-sm text-white placeholder-neutral-500 outline-none"
        />
        <button
          type="submit"
          class="bg-gradient-to-r from-amber-500 to-amber-300 text-black font-semibold px-4 py-2.5 rounded-xl text-xs tracking-wider hover:brightness-110 active:scale-95 transition shrink-0"
        >
          SEND
        </button>
      </form>
    </div>
  </div>

  <script>
    const FOUNDER_PIN = "060709";
    let chatHistory = JSON.parse(localStorage.getItem("DYNAST_CHAT_MEMORY") || "[]");
    let stagedAction = null;
    let isMuted = false;
    let continuousLiveMode = false;
    let currentState = "ONLINE"; // ONLINE | LISTENING | THINKING | SPEAKING

    // Web Audio API Pre-Amp & Real-Time Frequency Analyser
    let audioCtx = null;
    let analyser = null;
    let gainNode = null;
    let compressorNode = null;
    let freqData = null;
    let currentAudioSource = null;

    // Concurrency & Animation Locks
    let activeFetchController = null;
    let activeRecognition = null;
    let textAnimInterval = null;

    chatHistory = chatHistory.map((item) => ({
      role: item.role,
      text: String(item.text || "").replace(/,\s*Hanzalah([.!?])/gi, "$1")
    }));
    saveHistory();

    // Initialize Web Audio Graph with 2.5x Loudspeaker Gain + Studio Vocal Compressor
    function initAudioEngine() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AudioCtx) {
        audioCtx = new AudioCtx();

        compressorNode = audioCtx.createDynamicsCompressor();
        compressorNode.threshold.setValueAtTime(-20, audioCtx.currentTime);
        compressorNode.knee.setValueAtTime(18, audioCtx.currentTime);
        compressorNode.ratio.setValueAtTime(4, audioCtx.currentTime);
        compressorNode.attack.setValueAtTime(0.003, audioCtx.currentTime);
        compressorNode.release.setValueAtTime(0.15, audioCtx.currentTime);

        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(2.5, audioCtx.currentTime); // 2.5x Volume Boost

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        analyser.smoothingTimeConstant = 0.8;
        freqData = new Uint8Array(analyser.frequencyBinCount);

        compressorNode.connect(gainNode);
        gainNode.connect(analyser);
        analyser.connect(audioCtx.destination);
      }

      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function unlockDynast() {
      const pinVal = document.getElementById("pinInput").value.trim();
      if (pinVal !== FOUNDER_PIN) {
        document.getElementById("pinError").classList.remove("hidden");
        return;
      }
      initAudioEngine();
      document.getElementById("lockScreen").classList.add("hidden");
      document.getElementById("mainScreen").classList.remove("hidden");
      startOrbAnimation();
    }

    function toggleHub() {
      document.getElementById("hubPanel").classList.toggle("hidden");
    }

    function toggleContinuousLive() {
      initAudioEngine();
      continuousLiveMode = !continuousLiveMode;
      const btn = document.getElementById("liveModeBtn");
      if (continuousLiveMode) {
        btn.className = "glass-pill px-3.5 py-1.5 rounded-full flex items-center gap-1.5 border-amber-400/60 text-amber-200";
        btn.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span><span>Hands-Free Live: ON</span>`;
        startListening();
      } else {
        stopListening();
        btn.className = "glass-pill px-3.5 py-1.5 rounded-full flex items-center gap-1.5 text-neutral-300";
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-neutral-500"></span><span>Hands-Free Live: OFF</span>`;
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      stopSpeaking();
      const btn = document.getElementById("muteBtn");
      btn.textContent = isMuted ? "MUTED" : "GAIN: 2.5X";
      btn.className = isMuted
        ? "glass-pill px-3 py-1.5 rounded-full text-[10px] font-mono-tech text-rose-400"
        : "glass-pill px-3 py-1.5 rounded-full text-[10px] font-mono-tech text-amber-300";
    }

    function stopListening() {
      if (activeRecognition) {
        try { activeRecognition.stop(); } catch (e) {}
        try { activeRecognition.abort(); } catch (e) {}
        activeRecognition = null;
      }
    }

    function stopSpeaking() {
      if (currentAudioSource) {
        try { currentAudioSource.stop(); } catch (e) {}
        currentAudioSource = null;
      }
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function saveHistory() {
      localStorage.setItem("DYNAST_CHAT_MEMORY", JSON.stringify(chatHistory.slice(-10)));
    }

    function clearHistory() {
      chatHistory = [];
      stagedAction = null;
      localStorage.removeItem("DYNAST_CHAT_MEMORY");
      document.getElementById("confirmBox").classList.add("hidden");
      document.getElementById("hubPanel").classList.add("hidden");
      animateReplyText("Memory cleared. What would you like to focus on next?");
    }

    function setVisualStatus(state, latencyMs = null) {
      currentState = state;
      const statusText = document.getElementById("statusText");
      const statusDot = document.getElementById("statusDot");
      const centerLabel = document.getElementById("orbCenterLabel");
      const latencyLabel = document.getElementById("latencyLabel");

      if (latencyMs) {
        latencyLabel.textContent = `${(latencyMs / 1000).toFixed(1)}s • LIVE VOICE`;
      }

      if (state === "LISTENING") {
        statusText.textContent = "LISTENING LIVE";
        statusDot.className = "w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_12px_#38bdf8] animate-ping";
        centerLabel.textContent = "Listening...";
      } else if (state === "THINKING") {
        statusText.textContent = "SYNTHESIZING";
        statusDot.className = "w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_12px_#c084fc] animate-pulse";
        centerLabel.textContent = "Synthesizing...";
      } else if (state === "SPEAKING") {
        statusText.textContent = "SPEAKING LIVE";
        statusDot.className = "w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_12px_#fbbf24] animate-pulse";
        centerLabel.textContent = "Tap to Interrupt";
      } else {
        statusText.textContent = "LIVE READY";
        statusDot.className = "w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]";
        centerLabel.textContent = "Tap to Speak";
      }
    }

    function animateReplyText(text) {
      if (textAnimInterval) {
        clearInterval(textAnimInterval);
        textAnimInterval = null;
      }
      const el = document.getElementById("replyText");
      const words = String(text).split(" ");
      el.textContent = "";
      let i = 0;
      textAnimInterval = setInterval(() => {
        if (i >= words.length) {
          clearInterval(textAnimInterval);
          textAnimInterval = null;
          return;
        }
        el.textContent += (i === 0 ? "" : " ") + words[i];
        i++;
      }, 42);
    }

    // Play the Pre-Synthesized Neural Male Audio & Reveal Text at the Exact Same Millisecond
    async function playSynchronizedResponse(replyText, audioBase64, elapsedMs) {
      stopListening();
      stopSpeaking();
      initAudioEngine();

      if (!isMuted && audioBase64 && audioCtx) {
        try {
          const binaryString = atob(audioBase64);
          const len = binaryString.length;
          const bytes = new Uint8Array(len);
          for (let i = 0; i < len; i++) {
            bytes[i] = binaryString.charCodeAt(i);
          }

          const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer.slice(0));
          const source = audioCtx.createBufferSource();
          source.buffer = audioBuffer;
          source.connect(compressorNode);
          currentAudioSource = source;

          source.onended = () => {
            currentAudioSource = null;
            setVisualStatus("ONLINE");
            if (continuousLiveMode) {
              setTimeout(() => startListening(), 280);
            }
          };

          // Start audio and text reveal on the exact same frame
          setVisualStatus("SPEAKING", elapsedMs);
          animateReplyText(replyText);
          source.start(0);
          return;
        } catch (e) {}
      }

      // If muted, just reveal the text
      setVisualStatus("ONLINE", elapsedMs);
      animateReplyText(replyText);
    }

    async function executeConfirmedAction() {
      if (!stagedAction) return;
      setVisualStatus("THINKING");
      document.getElementById("confirmBox").classList.add("hidden");

      try {
        const startTime = performance.now();
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ confirmAction: stagedAction })
        });
        const elapsed = performance.now() - startTime;
        const data = await res.json();
        stagedAction = null;

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          animateReplyText("Error: " + (data.error || "Failed to push update."));
          return;
        }

        chatHistory.push({ role: "DYNAST", text: data.reply });
        saveHistory();
        await playSynchronizedResponse(data.reply, data.audioBase64, elapsed);
      } catch (err) {
        setVisualStatus("ONLINE");
        animateReplyText("Network Error: " + err.message);
      }
    }

    function cancelStagedAction() {
      stagedAction = null;
      document.getElementById("confirmBox").classList.add("hidden");
      animateReplyText("Update cancelled.");
      setVisualStatus("ONLINE");
    }

    async function sendCommand(commandText) {
      if (!commandText.trim()) return;

      if (activeFetchController) {
        try { activeFetchController.abort(); } catch (e) {}
        activeFetchController = null;
      }
      stopListening();
      stopSpeaking();
      initAudioEngine();

      const lower = commandText.trim().toLowerCase();
      if (stagedAction && (lower === "confirm" || lower === "confirm update" || lower === "deploy" || lower === "yes")) {
        await executeConfirmedAction();
        return;
      }

      const startTime = performance.now();
      setVisualStatus("THINKING");

      const transcriptEl = document.getElementById("transcriptText");
      transcriptEl.textContent = "“" + commandText + "”";
      transcriptEl.classList.remove("hidden");

      activeFetchController = new AbortController();

      try {
        const res = await fetch("/api/dynast", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: commandText,
            chatHistory: chatHistory
          }),
          signal: activeFetchController.signal
        });

        const elapsed = performance.now() - startTime;
        const data = await res.json();
        activeFetchController = null;

        if (!res.ok || data.error) {
          setVisualStatus("ONLINE");
          animateReplyText(data.error || "Something went wrong.");
          return;
        }

        if (data.pendingAction) {
          stagedAction = data.pendingAction;
          document.getElementById("confirmDetails").textContent =
            `${stagedAction.filePath} — ${stagedAction.summaryOfChanges}`;
          document.getElementById("confirmBox").classList.remove("hidden");
        }

        chatHistory.push({ role: "Hanzalah", text: commandText });
        chatHistory.push({ role: "DYNAST", text: data.reply });
        saveHistory();

        await playSynchronizedResponse(data.reply, data.audioBase64, elapsed);
      } catch (err) {
        if (err.name === "AbortError") return;
        setVisualStatus("ONLINE");
        animateReplyText("Connection interrupted. Tap the orb to try again.");
      }
    }

    function handleTextSubmit(e) {
      e.preventDefault();
      const input = document.getElementById("textInput");
      const val = input.value;
      input.value = "";
      sendCommand(val);
    }

    function handleOrbTap() {
      initAudioEngine();
      if (currentState === "SPEAKING") {
        stopSpeaking();
        setVisualStatus("ONLINE");
        return;
      }
      startListening();
    }

    function startListening() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Please use Google Chrome for live voice chat.");
        return;
      }

      stopSpeaking();
      stopListening();

      const recognition = new SpeechRecognition();
      activeRecognition = recognition;
      recognition.lang = "en-IN";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setVisualStatus("LISTENING");
      recognition.onresult = (e) => {
        const text = e.results[0][0].transcript;
        activeRecognition = null;
        sendCommand(text);
      };
      recognition.onerror = () => {
        activeRecognition = null;
        setVisualStatus("ONLINE");
      };
      recognition.onend = () => {
        activeRecognition = null;
        if (currentState === "LISTENING") setVisualStatus("ONLINE");
      };
      recognition.start();
    }

    // 60FPS FLUID PLASMA ORB DRIVEN BY LIVE WEB AUDIO FREQUENCIES
    function startOrbAnimation() {
      const canvas = document.getElementById("orbCanvas");
      const ctx = canvas.getContext("2d");
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      let time = 0;

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        let audioEnergy = 0;
        if (analyser && currentState === "SPEAKING") {
          analyser.getByteFrequencyData(freqData);
          let sum = 0;
          for (let i = 0; i < 32; i++) sum += freqData[i];
          audioEnergy = sum / (32 * 255);
        } else if (currentState === "LISTENING") {
          audioEnergy = 0.22 + Math.sin(time * 6) * 0.12;
        } else if (currentState === "THINKING") {
          audioEnergy = 0.35 + Math.sin(time * 10) * 0.15;
        } else {
          audioEnergy = 0.05 + Math.sin(time * 2) * 0.03;
        }

        let primaryRGB = "245, 158, 11";
        let accentRGB = "251, 191, 36";
        if (currentState === "LISTENING") {
          primaryRGB = "56, 189, 248";
          accentRGB = "125, 211, 252";
        } else if (currentState === "THINKING") {
          primaryRGB = "168, 85, 247";
          accentRGB = "245, 158, 11";
        }

        const baseRadius = 68 + audioEnergy * 28;

        const glowGrad = ctx.createRadialGradient(cx, cy, baseRadius * 0.3, cx, cy, baseRadius * 1.9);
        glowGrad.addColorStop(0, `rgba(${primaryRGB}, ${0.28 + audioEnergy * 0.35})`);
        glowGrad.addColorStop(0.5, `rgba(${accentRGB}, ${0.10 + audioEnergy * 0.15})`);
        glowGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glowGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 1.9, 0, Math.PI * 2);
        ctx.fill();

        for (let layer = 0; layer < 4; layer++) {
          ctx.beginPath();
          const points = 90;
          const speed = (layer % 2 === 0 ? 1 : -1) * (1.8 + layer * 0.6);
          const waveAmp = (4 + layer * 3.5) * (1 + audioEnergy * 3.2);

          for (let i = 0; i <= points; i++) {
            const angle = (i / points) * Math.PI * 2;
            const harmonic =
              Math.sin(angle * (3 + layer) + time * speed) * waveAmp +
              Math.cos(angle * (5 - layer) - time * 2.2) * (waveAmp * 0.5);
            const r = baseRadius + harmonic;
            const x = cx + Math.cos(angle) * r;
            const y = cy + Math.sin(angle) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.strokeStyle = `rgba(${layer % 2 === 0 ? primaryRGB : accentRGB}, ${0.42 - layer * 0.08 + audioEnergy * 0.25})`;
          ctx.lineWidth = 1.6 + audioEnergy * 1.5;
          ctx.stroke();
        }

        const coreGrad = ctx.createRadialGradient(cx - 12, cy - 12, 8, cx, cy, baseRadius * 0.92);
        coreGrad.addColorStop(0, `rgba(255, 255, 255, ${0.18 + audioEnergy * 0.3})`);
        coreGrad.addColorStop(0.45, `rgba(${primaryRGB}, ${0.15 + audioEnergy * 0.2})`);
        coreGrad.addColorStop(1, "rgba(5, 5, 10, 0.92)");
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, baseRadius * 0.92, 0, Math.PI * 2);
        ctx.fill();

        time += 0.025 + audioEnergy * 0.04;
        requestAnimationFrame(render);
      }

      render();
    }
  </script>
</body>
</html>
